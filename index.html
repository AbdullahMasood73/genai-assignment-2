<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trial screening workbench</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f1f5f4;color:#173732;font:16px/1.5 "Segoe UI",sans-serif}main{max-width:1060px;margin:auto;padding:3rem 1.5rem}h1{font:normal clamp(2.5rem,5vw,4rem)/1.05 Georgia;margin:0}header{border-bottom:3px solid #187362;padding-bottom:1rem}section,article{background:white;border:1px solid #cad9d3;padding:1.4rem;margin-top:1rem;border-radius:8px}label{display:block;font-weight:650;margin:.7rem 0 .25rem}textarea,select,button{font:inherit;padding:.6rem;border:1px solid #8ca69e;border-radius:5px}textarea{width:100%;resize:vertical}button{background:#155f50;color:white;cursor:pointer}button:disabled{opacity:.6}button.secondary{background:white;color:#155f50}blockquote{margin:.6rem 0;padding:.5rem 1rem;border-left:3px solid #2d8471;background:#eff7f4}h2,h3{line-height:1.2}small{display:block;color:#465e58}.actions{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-top:1rem}@media print{header,.inputs,.actions{display:none}}</style>
<main><header><h1>Trial screening workbench</h1><p>Educational screening prototype. Clinical enrollment decisions require professional review.</p></header>
<section class="inputs"><label for="note">Patient record</label><textarea id="note" rows="4" placeholder="Enter a note or numbered patient sentences"></textarea>
<label for="criteria">Trial criteria</label><small>One rule per line. Begin with inclusion | or exclusion |.</small><textarea id="criteria" rows="3"></textarea>
<div class="actions"><label for="mode">Decoding</label><select id="mode"><option value="cached">KV cached</option><option value="compare">Compare all three modes</option><option value="uncached">Uncached</option><option value="speculative">Speculative</option></select><button id="run">Screen criteria</button><button class="secondary" id="example">Load example</button></div></section>
<p role="status" id="status"></p><div id="results"></div><button hidden id="download">Export screening report</button></main>
<script>
const el=id=>document.getElementById(id);let report;
el('example').onclick=()=>{el('note').value='0. A 45-year-old patient reports a persistent dry cough.\n1. The patient denies a history of smoking.';el('criteria').value='inclusion | Age at least 18 years.\nexclusion | Current tobacco use.'};
function add(parent,tag,text){const node=document.createElement(tag);node.textContent=text;parent.append(node);return node}
el('run').onclick=async()=>{const results=el('results');results.replaceChildren();el('download').hidden=true;el('run').disabled=true;el('status').textContent='Screening…';try{const response=await fetch('/screen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note:el('note').value,criteria:el('criteria').value.split('\n').filter(s=>s.trim()),mode:el('mode').value})});report=await response.json();if(!response.ok)throw Error(report.error);add(results,'h2',report.overall);for(const r of report.results){const card=add(results,'article','');add(card,'small',r.type.toUpperCase());add(card,'h3',r.criterion);add(card,'strong',r.label);add(card,'p',r.explanation);for(const e of r.evidence)add(card,'blockquote',e.id+'. '+e.text);add(card,'small',Object.entries(r.latency_ms).map(([k,v])=>k+' '+v+' ms').join(' · '));if(r.draft)add(card,'small','Draft tokens accepted '+r.draft.accepted+' of '+r.draft.proposed);if(Object.keys(r.latency_ms).length>1)add(card,'small','Token agreement: '+r.agreement)}el('download').hidden=false;el('status').textContent=report.model}catch(e){el('status').textContent=e.message}finally{el('run').disabled=false}};
el('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([report.notice+'\n'+report.model+'\n\n'+el('results').innerText],{type:'text/plain'}));a.download='screening-report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
